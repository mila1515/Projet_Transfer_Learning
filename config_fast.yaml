general:
  seed: 42

data:
  data_dir: data/raw/chest_xray
  img_size: [160, 160]
  validation_source: train_split
  validation_split: 0.15
  cache_in_memory: false

model:
  backbone: mobilenetv2
  dropout_rate: 0.2
  dense_units: 128
  trainable_layers: 20
  use_augmentation: true

training:
  batch_size: 32
  epochs: 5
  learning_rate: 0.0001
  patience: 2
  use_class_weights: true
  model_dir: models
  model_output_name: pneumonia_mobilenetv2_fast.keras

evaluation:
  threshold: 0.5
  report_dir: reports/fast

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: pneumonia-transfer-learning-fast
  register_model: false
  registered_model_name: PneumoniaClassifierFast
